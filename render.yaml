services:
  - type: web
    name: personal-portfolio
    env: node
    plan: free
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: PORT
        value: 10000
      - key: AUTHORIZED_ADMIN_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
      - key: CALLMEBOT_API_KEY
        sync: false
      - key: AUTHORIZED_ADMIN_PHONE
        sync: false
      - key: ADMIN_MASTER_PIN
        sync: false

