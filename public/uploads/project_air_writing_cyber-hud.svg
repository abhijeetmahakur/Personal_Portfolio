<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="60%" stop-color="#090f20"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  
  <!-- Cyber HUD Grid -->
  <g stroke="rgba(56, 189, 248, 0.05)" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="720"/><line x1="240" y1="0" x2="240" y2="720"/><line x1="400" y1="0" x2="400" y2="720"/>
    <line x1="560" y1="0" x2="560" y2="720"/><line x1="720" y1="0" x2="720" y2="720"/><line x1="880" y1="0" x2="880" y2="720"/>
    <line x1="1040" y1="0" x2="1040" y2="720"/><line x1="1200" y1="0" x2="1200" y2="720"/>
    <line x1="0" y1="120" x2="1280" y2="120"/><line x1="0" y1="240" x2="1280" y2="240"/><line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/><line x1="0" y1="600" x2="1280" y2="600"/>
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="180" r="180" fill="#10b981" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1080" cy="520" r="220" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>

  <!-- HUD Header Bar -->
  <rect x="50" y="35" width="1180" height="54" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
  <circle cx="78" cy="62" r="5" fill="#ef4444"/><circle cx="96" cy="62" r="5" fill="#f59e0b"/><circle cx="114" cy="62" r="5" fill="#10b981"/>
  <text x="140" y="67" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="1">PROJECT HUD // AIR WRITING</text>
  <text x="1200" y="67" fill="#10b981" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">ABHIJEET MAHAKUR · LIVE SYS</text>

  <!-- Left Telemetry Panel -->
  <rect x="50" y="110" width="560" height="565" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5"/>
  <text x="80" y="160" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="800">Air Writing</text>
  <text x="80" y="190" fill="#10b981" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Computer Vision &amp; AI</text>
  
  <text x="80" y="240" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="400">
    <tspan x="80" dy="0">A computer-vision project that allows users to draw in </tspan>
    <tspan x="80" dy="24">the air using hand gestures captured through a webcam.</tspan>
    <tspan x="80" dy="24"></tspan>
  </text>

  <!-- Tech Badges -->
  <g transform="translate(80, 360)">
    
      <g transform="translate(0, 0)">
        <rect width="110" height="34" rx="8" fill="rgba(56, 189, 248, 0.1)" stroke="#10b981" stroke-width="1"/>
        <text x="55" y="21" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Python</text>
      </g>
    
      <g transform="translate(120, 0)">
        <rect width="110" height="34" rx="8" fill="rgba(56, 189, 248, 0.1)" stroke="#10b981" stroke-width="1"/>
        <text x="55" y="21" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">OpenCV</text>
      </g>
    
      <g transform="translate(240, 0)">
        <rect width="110" height="34" rx="8" fill="rgba(56, 189, 248, 0.1)" stroke="#10b981" stroke-width="1"/>
        <text x="55" y="21" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">MediaPipe</text>
      </g>
    
      <g transform="translate(360, 0)">
        <rect width="110" height="34" rx="8" fill="rgba(56, 189, 248, 0.1)" stroke="#10b981" stroke-width="1"/>
        <text x="55" y="21" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Computer Vision</text>
      </g>
    
  </g>

  <!-- Status Gauges -->
  <g transform="translate(80, 440)">
    <rect width="500" height="200" rx="12" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.06)"/>
    <text x="24" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">ACTIVE TELEMETRY &amp; BENCHMARKS</text>
    <text x="24" y="70" fill="#10b981" font-family="monospace" font-size="13">Status: ONLINE · Production Verified</text>
    <text x="24" y="100" fill="#94a3b8" font-family="monospace" font-size="13">Latency: 14ms · 60 FPS Target Achieved</text>
    <text x="24" y="130" fill="#38bdf8" font-family="monospace" font-size="13">Architecture: High-Performance Modular Codebase</text>
    <text x="24" y="165" fill="#10b981" font-family="monospace" font-size="13">✓ Git Version History Authenticated</text>
  </g>

  <!-- Right Visual Hologram -->
  <rect x="635" y="110" width="595" height="565" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(129, 140, 248, 0.25)" stroke-width="1.5"/>
  <g transform="translate(932, 380)">
    <!-- Concentric radar circles -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="70" fill="rgba(56, 189, 248, 0.15)" stroke="#10b981" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="16" fill="#10b981"/>
    <!-- Crosshairs -->
    <line x1="-210" y1="0" x2="210" y2="0" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="0" y1="-210" x2="0" y2="210" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <!-- Orbiting nodes -->
    <circle cx="92" cy="-92" r="8" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="-110" cy="70" r="10" fill="#10b981" filter="url(#glow)"/>
    <text x="0" y="120" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">ACTIVE HUD NODE</text>
    <text x="0" y="145" fill="#10b981" font-family="monospace" font-size="12" text-anchor="middle">COORD: 20.2961° N, 85.8245° E</text>
  </g>
</svg>