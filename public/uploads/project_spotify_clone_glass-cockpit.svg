<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cardG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.8)"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Fluid Ambient Gradient Orbs -->
  <circle cx="280" cy="200" r="260" fill="#22c55e" opacity="0.16" filter="url(#glow)"/>
  <circle cx="1000" cy="500" r="300" fill="#a855f7" opacity="0.14" filter="url(#glow)"/>

  <!-- Glass Card Main Frame -->
  <rect x="60" y="50" width="1160" height="620" rx="24" fill="url(#cardG)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Top Glass Bar -->
  <g transform="translate(100, 90)">
    <rect width="1080" height="60" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="30" cy="30" r="6" fill="#ef4444"/><circle cx="50" cy="30" r="6" fill="#f59e0b"/><circle cx="70" cy="30" r="6" fill="#10b981"/>
    <text x="100" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Spotify Clone</text>
    <text x="1050" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="end">Abhijeet Mahakur · Portfolio Project</text>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(100, 185)">
    <text y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">Spotify Clone</text>
    <text y="75" fill="#22c55e" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Audio Streaming Web App</text>
    
    <text y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" line-height="1.6">
      <tspan x="0" dy="0">A high-fidelity audio streaming web application inspired by </tspan>
      <tspan x="0" dy="26">Spotify, featuring interactive song queues, glowing waveform visu</tspan>
      <tspan x="0" dy="26">alizations, responsive music player controls, and curated playlis</tspan>
    </text>

    <!-- Interactive Badges -->
    <g transform="translate(0, 220)">
      
        <g transform="translate(0, 0)">
          <rect width="105" height="38" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)"/>
          <text x="52" y="24" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">HTML5</text>
        </g>
      
        <g transform="translate(115, 0)">
          <rect width="105" height="38" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)"/>
          <text x="52" y="24" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">CSS3</text>
        </g>
      
        <g transform="translate(230, 0)">
          <rect width="105" height="38" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)"/>
          <text x="52" y="24" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">JavaScript</text>
        </g>
      
        <g transform="translate(345, 0)">
          <rect width="105" height="38" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)"/>
          <text x="52" y="24" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">Audio API</text>
        </g>
      
        <g transform="translate(460, 0)">
          <rect width="105" height="38" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)"/>
          <text x="52" y="24" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">Responsive UI</text>
        </g>
      
    </g>

    <!-- Metrics Pods -->
    <g transform="translate(0, 290)">
      <rect width="160" height="90" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
      <text x="20" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">EFFICIENCY</text>
      <text x="20" y="68" fill="#22c55e" font-family="system-ui, sans-serif" font-size="26" font-weight="800">Optimal</text>

      <rect x="180" width="160" height="90" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
      <text x="200" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">DEPLOYMENT</text>
      <text x="200" y="68" fill="#10b981" font-family="system-ui, sans-serif" font-size="26" font-weight="800">Verified</text>

      <rect x="360" width="160" height="90" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
      <text x="380" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">QUALITY</text>
      <text x="380" y="68" fill="#a855f7" font-family="system-ui, sans-serif" font-size="26" font-weight="800">Production</text>
    </g>
  </g>

  <!-- Right Visual Stage -->
  <g transform="translate(680, 185)">
    <rect width="500" height="440" rx="18" fill="rgba(10, 15, 28, 0.85)" stroke="rgba(255,255,255,0.08)"/>
    <!-- Glass cards preview inside stage -->
    <rect x="30" y="35" width="440" height="170" rx="14" fill="rgba(255,255,255,0.02)" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.3"/>
    <circle cx="75" cy="80" r="24" fill="#22c55e" opacity="0.2" stroke="#22c55e" stroke-width="2"/>
    <text x="120" y="75" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Spotify Clone</text>
    <text x="120" y="100" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Engineered by Abhijeet Mahakur</text>
    <rect x="50" y="130" width="400" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>
    <rect x="50" y="130" width="280" height="8" rx="4" fill="#22c55e"/>

    <!-- Second Card inside stage -->
    <rect x="30" y="225" width="440" height="180" rx="14" fill="rgba(255,255,255,0.02)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.3"/>
    <text x="50" y="265" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="700">// System Architecture</text>
    <text x="50" y="295" fill="#22c55e" font-family="monospace" font-size="13">&gt; status: 200 OK (Clean Compile)</text>
    <text x="50" y="325" fill="#94a3b8" font-family="monospace" font-size="13">&gt; github: https://github.com/abhijeetmahakur</text>
    <text x="50" y="355" fill="#10b981" font-family="monospace" font-size="13">&gt; integrity: 100% Verified &amp; Tested</text>
  </g>
</svg>