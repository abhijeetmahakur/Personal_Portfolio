        <rect x="496" y="-16" width="90" height="24" rx="6" fill="rgba(16, 185, 129, 0.15)"/>
        <text x="541" y="0" fill="#34d399" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">VERIFIED</text>
        <text x="656" y="0" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Late</text>
      </g>
    
      <g transform="translate(24, 250)">
        <text y="0" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Emily Chen</text>
        <text x="206" y="0" fill="#38bdf8" font-family="monospace" font-size="13">ITER-2024-04</text>
        <text x="336" y="0" fill="#94a3b8" font-family="monospace" font-size="13">08:38:11 AM</text>
        <rect x="496" y="-16" width="90" height="24" rx="6" fill="rgba(16, 185, 129, 0.15)"/>
        <text x="541" y="0" fill="#34d399" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">VERIFIED</text>
        <text x="656" y="0" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Present</text>
